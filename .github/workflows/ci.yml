name: CI

# Гейты прогоняются здесь, а не на машине владельца. Раньше PostgreSQL 16/17
# приходилось запускать вручную из терминала, и результат жил только в чужом
# скриншоте; теперь он лежит в логах прогона и виден в PR.

on:
  push:
    branches: ["**"]
  pull_request:
    # labeled сохраняется для ручного повторного запуска через label; AP5
    # запускается и на обычных opened/synchronize/reopened событиях.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      cycle7_receipt_head_sha:
        description: "Published HEAD described by the sanitized Cycle 7 receipt"
        required: false
        type: string
      cycle7_receipt_b64:
        description: "Base64 sanitized Cycle 7 receipt; no credentials or photo"
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Что именно изменила ветка. AP5 теперь обязательный потребитель этого
  # результата, а остальные тяжёлые database jobs используют scope для
  # сохранения существующего docs-only budget guard.
  #
  # Метка остаётся как ДОПОЛНИТЕЛЬНЫЙ способ позвать прогон руками, а не как
  # единственный. Разница принципиальная: забытая метка раньше означала, что
  # изменение V1 уезжает в main, ни разу не пройдя через браузер.
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      m4_v1: ${{ steps.detect.outputs.m4_v1 }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: без неё нет ни базы сравнения, ни merge-base.
          fetch-depth: 0
      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA}"
          # Первый push в новую ветку не имеет предшественника (нули), и
          # ссылка на удалённый коммит может не существовать локально. В обоих
          # случаях сравниваем с общим предком main — это честная база для
          # ветки и не заставляет гонять AP5 на каждом первом коммите.
          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "${HEAD_SHA}" || true)"
          fi
          if [ -z "${base}" ]; then
            # Базы нет вообще — считаем, что тронуто всё. Пропущенный прогон
            # хуже лишнего.
            echo "m4_v1=true" >> "${GITHUB_OUTPUT}"
            echo "no comparison base; assuming M4 V1 changed"
            exit 0
          fi
          changed="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          echo "${changed}"
          # Поверхность вертикали V1: миграции модуля 4, воркер расчёта,
          # прикладные контракты ProjectCEO, маршрут команд, рабочее
          # пространство, скрипты включения и сам харнесс AP5.
          if printf '%s\n' "${changed}" | grep -qE \
            -e '^supabase/migrations/[0-9]+_projectceo_m4_' \
            -e '^lib/project-intelligence/workers/change-impact/' \
            -e '^lib/project-intelligence/delivery/projectceo/' \
            -e '^lib/project-intelligence/adapters/postgres/execution\.ts$' \
            -e '^scripts/run-change-impact-worker\.ts$' \
            -e '^components/projectceo/project-workspace\.tsx$' \
            -e '^app/api/projectceo/commands/' \
            -e '^tests/ap1/environment/enable-m4-' \
            -e '^tests/ap5/' \
            -e '^\.github/workflows/ci\.yml$'; then
            echo "m4_v1=true" >> "${GITHUB_OUTPUT}"
          else
            echo "m4_v1=false" >> "${GITHUB_OUTPUT}"
          fi
          # Документные изменения (markdown везде + CSV-матрицы в docs/) не
          # гоняют тяжёлые джобы: включённые минуты Actions на private-репо
          # конечны, и в августе 2026 полный матричный прогон на каждый
          # docs-only push выбрал месячную квоту за полторы недели — CI встал
          # на неделю. Правило консервативное: docs_only=true ТОЛЬКО когда
          # список изменённых файлов непуст и КАЖДЫЙ файл — документ; пустой
          # список, сомнение и сам ci.yml всегда считаются кодом.
          if printf '%s\n' "${changed}" | grep -qvE '(^docs/.*\.(md|csv)$|\.md$)'; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs_only=true" >> "${GITHUB_OUTPUT}"
          fi

  gates:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Контрактный тест bootstrap-манифеста стенда запускает сам скрипт —
      # отказ от production ref, коды выхода, разбор аргументов. Без zsh на
      # раннере эта половина тестов помечалась бы пропущенной и молча ничего не
      # проверяла: скрипт на zsh, а джоба `gates` — единственная, где вообще
      # исполняется `npm run test`.
      - name: Install zsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  database:
    name: DB4 on ${{ matrix.image }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [postgres:16-alpine, postgres:17-alpine]
    steps:
      - uses: actions/checkout@v4
      # Скриптам нужны только docker, zsh и rg — npm здесь не требуется.
      - name: Install zsh and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh ripgrep
      - name: Migration chain, M2 operations, concurrency and restart replay
        env:
          PI_DB_IMAGE: ${{ matrix.image }}
        run: zsh tests/db4/run.zsh

  # DB5 — исполнение модуля 4 целиком: заявка на изменение, воркерный расчёт
  # влияния, ревью, веха, фотодоказательство, приёмка, документ передачи и
  # сборка архива.
  #
  # Задание существует потому, что харнесс без гейта гарантий не даёт. DB5 был
  # зелёным на `e74f4b3` (`MASTER_EXECUTION_PLAN` §2.3), не стоял ни в одном
  # обязательном прогоне и молча покраснел, когда guardrail модуля 3 отозвал у
  # `authenticated` публикацию baseline. Обнаружилось это только при подготовке
  # решения по execution layer — то есть спустя недели.
  #
  # Запрет прогон не снимает: инкремент 2 остаётся закрытым для `anon`,
  # `authenticated` и `service_role` до и после цепочки
  # (`05_default_deny_before.sql`, `90_default_deny_after.sql`), а человеческие
  # RPC инкремента 2 вызывает отдельная `nologin`-роль, живущая только внутри
  # одноразового контейнера.
  execution_database:
    name: DB5 on ${{ matrix.image }}
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [postgres:16-alpine, postgres:17-alpine]
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends zsh ripgrep
      - name: Default-deny, M4 execution chain, concurrency and restart replay
        env:
          PI_DB_IMAGE: ${{ matrix.image }}
        run: zsh tests/db5/run.zsh

  # AP5 — browser matrix на НАСТОЯЩЕМ стеке: Auth, PostgREST, RLS, пять
  # отдельных аутентифицированных сессий. Санитизированный харнесс
  # /projectceo-qa/[role] его не заменяет (AP1_RUNBOOK §5).
  #
  # AP5 всегда является обязательным job. Он поднимает disposable Supabase и
  # authenticated browser matrix на каждом CI-событии; skipped не считается
  # доказательством и превращается в failed job при проблеме prerequisite.
  #
  # Гейт блокирующий. Первым прогоном он нашёл реальный дефект (ревью источника
  # отвечало 500 из-за границы схем), дефект закрыт миграцией
  # `20260810050000` — держать его информационным дальше значит согласиться,
  # что следующую такую находку никто не заметит.
  #
  # Все AP5 tests должны иметь исполняемое утверждение. Отдельный JSON-gate
  # падает при любом skipped, включая новые `test.fixme`.
  ap5:
    name: AP5 authenticated browser matrix
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Порт из additional_redirect_urls в supabase/config.toml — Auth не примет
      # возврат на адрес, которого там нет.
      AP5_APP_URL: http://127.0.0.1:3100
      AP1_EMAIL_DOMAIN: remhaos.test
      AP1_CONFIRM_DISPOSABLE: "yes"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ap5-report.json
      AP5_POSTGRES_CONTAINER: supabase_db_archidom-ap1-disposable
      # Модули, которые должна видеть матрица ролей. Оба флага сравниваются со
      # строкой "true" буквально (feature-flag.ts, documentation-flag.ts):
      # "1" читается как «выключено», и команды модуля отвечают
      # operation_unavailable ещё до RPC.
      ARCHIDOM_LAYOUT_STUDIO_ENABLED: "true"
      REMHAOS_DOCUMENTATION_ENABLED: "true"
      # Модуль 4 включается здесь с 11.08: гейт 1 пройден, A6 §6.3 разрешает
      # интерфейс инкремента 1, а доказать его иначе, чем при включённом
      # модуле, нельзя — это и есть гейт 2. Включение действует только в этом
      # одноразовом стеке: по умолчанию флаг выключен, и вторая граница (права
      # в базе) закрыта guardrail'ами до явного шага ниже.
      REMHAOS_EXECUTION_ENABLED: "true"
    steps:
      - name: Require AP5 scope prerequisite
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ needs.scope.result }}" != "success" ]; then
            echo "AP5_REQUIRED_SCOPE_RESULT=${{ needs.scope.result }}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Версия зафиксирована контрактом supabase/config.toml.
          version: 2.109.1

      # Старый job-level пароль печатался GitHub Actions вместе с env каждого
      # шага. Credential нужен только живому disposable-стеку этого запуска:
      # создаём новый для каждого run, маскируем до записи в GITHUB_ENV и не
      # помещаем его в job-level env, который Actions печатает автоматически.
      - name: Generate and mask disposable AP1 credential
        shell: bash
        run: |
          set -euo pipefail
          credential="$(openssl rand -hex 24)"
          echo "::add-mask::${credential}"
          printf 'AP1_TEST_PASSWORD=%s\n' "${credential}" >> "${GITHUB_ENV}"

      - run: npm ci

      # Стек поднимается из репозиторного config.toml: порты, список схем в
      # Data API и custom access token hook берутся оттуда, а не из дефолтов.
      - name: Start Supabase stack
        run: supabase start

      - name: Export stack credentials
        run: |
          supabase status -o env > "${RUNNER_TEMP}/supabase.env"
          set -a && . "${RUNNER_TEMP}/supabase.env" && set +a
          # CLI переименовал ключи публикации; берём то из двух, что реально
          # пришло, вместо того чтобы падать на пустой переменной.
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-${PUBLISHABLE_KEY}}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-${SECRET_KEY}}"
            echo "SUPABASE_DB_URL=${DB_URL}"
          } >> "${GITHUB_ENV}"

      # Локальная схема auth принадлежит supabase_auth_admin и раздаёт pi_*
      # ролям права, которых на managed Supabase у них нет. Локальный раннер
      # AP1 отзывает их сразу после старта стека (run-local.zsh, start_stack), и
      # без этого шага гейт проверял бы среду, непохожую на боевую.
      - name: Model hosted auth ACLs
        run: psql "${SUPABASE_DB_URL}" -X --set ON_ERROR_STOP=1 -f tests/ap1/environment/apply-local-auth-compat.sql

      # Та же проверка состояния базы, что и в AP1: managed-auth ссылок не
      # осталось, request-claim helpers на месте, приватные гранты закрыты.
      - name: Verify database state
        run: psql "${SUPABASE_DB_URL}" -X --set ON_ERROR_STOP=1 -f tests/ap1/environment/verify-db.sql

      # Тот же верификатор, что и в локальном прогоне AP1: разрешённые схемы
      # отвечают, приватные закрыты 406, Auth и Storage живы.
      - name: Verify exposed schemas and service health
        run: supabase status --output json | node tests/ap1/environment/verify-runtime.mjs

      # Только auth-identity. Членства раздаёт owner приглашениями уже внутри
      # браузерного прогона: human operations через service role запрещены.
      - name: Provision five role identities
        run: npm run provision:ap1

      # Прямой обход приложения — буквально: настоящий access token, настоящий
      # PostgREST, настоящий HTTP. Шаг стоит ПОСЛЕ создания личностей (нужен
      # реальный пользователь) и ДО включения второй границы: включи мы её
      # раньше, проверка мерила бы уже открытую базу.
      - name: Verify M3 publication is closed on the Data API
        run: node tests/ap1/environment/verify-m3-data-api-closed.mjs

      # Вторая граница guardrail'а модуля 3 (`20260811010000`): по умолчанию
      # публикация закрыта правами в базе, и флаг приложения этого не отменяет —
      # PostgREST его не видит. Среда, где M3 намеренно открыт, включает вторую
      # половину выключателя явно. Здесь это одноразовый стек AP5; в продакшене
      # этот шаг не исполняется, и там модуль остаётся закрытым.
      #
      # Механизм временный: по решению владельца от 11.08 грант — способ открыть
      # модуль в одноразовой среде и default-deny до запуска M3, но НЕ финальный
      # production feature flag. Production-включение — отдельное решение.
      - name: Enable M3 publication on the database boundary
        run: psql "${SUPABASE_DB_URL}" -X --set ON_ERROR_STOP=1 -f tests/ap1/environment/enable-m3-publication.sql

      # То же самое для модуля 4, и по той же причине. Проверка стоит ДО
      # включения: первая попытка закрыть эту границу (`20260810070000`)
      # пропустила четыре командные RPC модуля, живущие в продуктовой схеме, и
      # выдача пакета была доступна через Data API при выключенном модуле.
      - name: Verify M4 execution is closed on the Data API
        run: node tests/ap1/environment/verify-m4-data-api-closed.mjs

      # Открывается РОВНО инкремент 1 (A6 §1.1 / DEC-025). Команды, которых не
      # авторизовал ни один документ, не открывает ни этот шаг, ни любая другая
      # среда: сам скрипт падает, если они окажутся доступны.
      - name: Enable M4 increment 1 on the database boundary
        run: psql "${SUPABASE_DB_URL}" -X --set ON_ERROR_STOP=1 -f tests/ap1/environment/enable-m4-increment-1.sql

      # Вертикаль V1 Impact (M4 IMPLEMENTATION GO от 12.08.2026): рассмотрение
      # готового прогона влияния и подтверждение его неполноты. Без этого шага
      # звено 12 упиралось бы в отозванные права, то есть проверяло бы
      # guardrail, а не цепочку.
      #
      # Открывается ТЕМ ЖЕ механизмом, что и production (DEC-033), а не
      # параллельным скриптом среды. Иначе браузерная цепочка доказывала бы
      # чужой выключатель: сценарий DB5 проверяет, что операция выдаёт ровно
      # два права (DEC-034: третья дверь закрыта навсегда), а AP5 — что с
      # этими правами архитектор действительно
      # проходит цепочку. Между «права такие» и «цепочка работает» не должно
      # быть шва, который никто не сверял.
      #
      # V2 и V3 операция не открывает и падает, если они окажутся доступны.
      - name: Enable M4 V1 Impact through the production switch
        run: |
          set -euo pipefail
          psql "${SUPABASE_DB_URL}" -X --set ON_ERROR_STOP=1 \
            -c "select projectceo_m4.open_v1_impact_production('AP5 harness', 'OWNER DECISION 12.08.2026 / DEC-033 — одноразовая среда AP5');"
          # Проверяется состояние в базе, а не то, что вызов не упал.
          open_now="$(psql "${SUPABASE_DB_URL}" -X -tAc \
            'select open_now from projectceo_m4.v1_impact_production_state();')"
          if [ "${open_now}" != "t" ]; then
            echo "AP5_V1_SWITCH_DID_NOT_OPEN: ${open_now}" >&2
            exit 1
          fi

      - name: Build and start the application
        env:
          # Токен приглашений детерминированный, значение локальное и одноразовое.
          PROJECTCEO_TOKEN_SECRET: ap5-local-only-invitation-secret
        run: |
          npm run build
          # nohup — чтобы процесс пережил завершение шага; лог кладём рядом,
          # он попадает в артефакты и объясняет падения на стороне сервера.
          PORT=3100 nohup npm run start > "${RUNNER_TEMP}/app.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/app.pid"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Authenticated role matrix and Kora chain
        run: |
          set +e
          npm run test:ap5 > "${RUNNER_TEMP}/ap5-output.log" 2>&1
          status=$?
          exit "${status}"

      - name: Summarize application log on failure
        if: failure()
        run: |
          if [ -f "${RUNNER_TEMP}/app.log" ]; then
            echo "AP5_APP_LOG_PRESENT lines=$(wc -l < "${RUNNER_TEMP}/app.log")"
          else
            echo "AP5_APP_LOG_MISSING"
          fi

      - name: Verify disposable stack on failure
        if: failure()
        run: |
          set +e
          supabase status >/dev/null 2>&1
          status=$?
          set -e
          echo "AP5_SUPABASE_STATUS_EXIT=${status}"

      - name: Reject skipped AP5 tests
        if: always()
        run: node tests/ap5/assert-no-skips.mjs "${PLAYWRIGHT_JSON_OUTPUT_FILE}"

      - name: Scan AP5 logs for credentials
        if: always()
        run: |
          set -euo pipefail
          files=()
          # The Playwright JSON receipt is checked structurally above. In CI the
          # reporter also embeds config.metadata.gitDiff, which is source code,
          # not a runtime log and can contain literal credential field names.
          for file in "${RUNNER_TEMP}/app.log" "${RUNNER_TEMP}/ap5-output.log"; do
            if [ -f "${file}" ]; then files+=("${file}"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "AP5_LOG_HYGIENE_FAILED no_logs_to_scan"
            exit 1
          fi
          node tests/ap1/environment/scan-log-hygiene.mjs "${files[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ap5-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the application
        if: always()
        run: kill "$(cat "${RUNNER_TEMP}/app.pid")" 2>/dev/null || true

  # Статический контракт цикла 7 остаётся отдельным от runtime: он проверяет,
  # что committed input не подменён completed receipt.
  cycle7-evidence:
    name: cycle 7 evidence (informational)
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: External real package gate
        run: npm run test:cycle7

  # Публикация уже полученного runtime receipt. Реальный runtime выполняется
  # из свежего локального disposable checkout с разрешённым фото; GitHub
  # получает только sanitized PASS.json и проверяет его against exact HEAD.
  cycle7-sanitized-receipt:
    name: cycle 7 sanitized receipt artifact
    needs: scope
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.cycle7_receipt_head_sha != ''
      && inputs.cycle7_receipt_b64 != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.cycle7_receipt_head_sha }}
          fetch-depth: 1
      - name: Validate sanitized receipt
        shell: bash
        env:
          RECEIPT_HEAD_SHA: ${{ inputs.cycle7_receipt_head_sha }}
          RECEIPT_B64: ${{ inputs.cycle7_receipt_b64 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RECEIPT_HEAD_SHA}"
          printf '%s' "${RECEIPT_B64}" | base64 --decode > "${RUNNER_TEMP}/PASS.json"
          jq -e --arg head "${RECEIPT_HEAD_SHA}" '
            .status == "completed"
            and .verdict == "EXTERNAL_REAL_PACKAGE_PASS"
            and .headSha == $head
            and (.executedAt | type == "string")
            and .markers == ["KORA_LOCAL_AUTHENTICATED_PASS", "EXTERNAL_REAL_PACKAGE_PASS"]
            and (.manifestDigest | test("^sha256:[0-9a-f]{64}$"))
            and .gates.koraAuthenticatedFiveRole == true
            and .gates.externalRealPackage == true
            and .gates.audit == true
            and .gates.authenticatedRead == true
            and .gates.privacy == true
            and .gates.tenancy == true
            and .gates.replay == true
            and ([keys[] | test("^(status|verdict|label|headSha|executedAt|markers|manifestDigest|fiveDistinctUsers|commandIds|stateRevisions|lineage|executor|koraRun|gates|proofs)$")] | all)
          ' "${RUNNER_TEMP}/PASS.json" > /dev/null
          if rg -n -i '/Users/|/Volumes/|/private/|/mnt/|bearer[[:space:]]|sk-[a-z0-9_-]+|sbp_token|refresh_token|BEGIN (RSA|OPENSSH|PRIVATE)' "${RUNNER_TEMP}/PASS.json" > /dev/null; then
            echo 'CYCLE7_RECEIPT_PRIVACY_FAILED' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cycle7-sanitized-evidence-${{ inputs.cycle7_receipt_head_sha }}
          path: ${{ runner.temp }}/PASS.json
          retention-days: 14
          if-no-files-found: error
