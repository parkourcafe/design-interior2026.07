# RemHaOS AP1 disposable authenticated Supabase environment.
#
# Runtime contract:
# - Supabase CLI is pinned to 2.109.1 by the AP1 run commands/report;
# - this project is local-only and must never be linked or pushed;
# - API exposure is allow-listed; private persistence schemas stay hidden;
# - all ports are intentionally outside the Supabase defaults.
project_id = "archidom-ap1-disposable"

[api]
enabled = true
port = 59621
schemas = [
  "public",
  "projectceo_api",
  "projectceo_read_api",
  "projectceo_product_api",
  # Листы документации M3 вызываются через PostgREST
  # (adapters/postgres/documentation.ts). Без этой строки RPC существуют в базе,
  # но недостижимы приложением — миграции при этом отчитываются об успехе.
  "projectceo_m3_api",
  "projectceo_m4_api",
  # Шлюз интеграций (A7 / DEC-031). Схема отдана Data API, но сама по себе она
  # ничего не открывает: usage без execute не даёт вызвать ни одной функции.
  # Кому что выдано — миграция 20260811050000 и матрица bridge-surface.ts.
  # Приватная projectceo_gateway при этом закрыта: она в том же регулярном
  # отрицании, что и остальные приватные схемы.
  "projectceo_gateway_api",
]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Supabase's 2026-04-28 secure default: every Data API object needs an
# explicit grant in addition to RLS / request-bound authorization.
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 59622
shadow_port = 59620
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 59629
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
# AP1 proves the exact immutable migration ledger first. Role users and Kora
# pilot data are provisioned later through Auth and request-bound commands.
enabled = false
sql_paths = []

[db.network_restrictions]
enabled = false
allowed_cidrs = ["127.0.0.1/32"]
allowed_cidrs_v6 = ["::1/128"]

[realtime]
enabled = false

[studio]
enabled = false
port = 59623
api_url = "http://127.0.0.1"

[local_smtp]
# Auth users are provisioned through the admin API in AP1. The disposable gate
# does not need a mailbox UI; excluding mailpit keeps the verified stack small.
enabled = false
port = 59624
smtp_port = 59625
pop3_port = 59626
admin_email = "ap1-local@archidom.invalid"
sender_name = "RemHaOS"

[storage]
enabled = true
file_size_limit = "100MiB"

[storage.s3_protocol]
enabled = false

[storage.image_transformation]
# AP1 verifies object isolation and signed access, not image derivatives.
enabled = false

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3100/auth/callback",
  "http://localhost:3100/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/projectceo_custom_access_token_hook"

[auth.rate_limit]
email_sent = 100
sms_sent = 2
anonymous_users = 1
token_refresh = 150
sign_in_sign_ups = 100
token_verifications = 100
web3 = 1

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 900

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[edge_runtime]
enabled = false
policy = "per_worker"
inspector_port = 59628
deno_version = 2

[analytics]
enabled = false
port = 59627
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[experimental.pgdelta]
enabled = true
