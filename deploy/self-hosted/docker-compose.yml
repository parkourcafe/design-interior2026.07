# RemHaOS: база данных на своём сервере (self-hosted Supabase) — для хранения
# данных в нужной стране (152-ФЗ: данные граждан РФ — в базе на территории РФ).
# Те же версии, что проверены на стенде 28.09–01.10.2026: все миграции
# репозитория, перенос данных и сквозной путь в браузере.
#
# Наружу открыт только шлюз (80/443). База слушает лишь 127.0.0.1 сервера —
# для миграций и переноса через SSH-туннель. Настройки — в .env
# (создаётся generate-env.sh; в репозиторий не коммитится).

name: remhaos-data

services:
  db:
    image: supabase/postgres:17.6.1.143
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: "3600"
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      # Пароли служебных ролей Auth/Storage/API = POSTGRES_PASSWORD.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    image: supabase/gotrue:v2.192.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Как в supabase/config.toml репозитория.
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      GOTRUE_PASSWORD_HIBP_ENABLED: ${PASSWORD_HIBP_ENABLED:-false}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/public/projectceo_custom_access_token_hook
      # Почта: подтверждение регистрации и коды входа — через свой SMTP.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # true — только для проверки без почты; в работе всегда false.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "900"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Шаблоны писем — с внутреннего адреса шлюза (наружу не опубликован):
      # не зависит от сертификата и доступа сервера к самому себе по внешнему IP.
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://gateway:8088/confirm_signup.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://gateway:8088/magic_link.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "RemHaOS: подтвердите регистрацию"
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "RemHaOS: вход"
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: RemHaOS
      # Лимиты по IP (как [auth.rate_limit] в config.toml). Без заголовка GoTrue
      # не различает клиентов и НЕ ограничивает подбор паролей и кодов. Caddy
      # перезаписывает X-Forwarded-For настоящим адресом клиента.
      GOTRUE_RATE_LIMIT_HEADER: X-Forwarded-For
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "150"
      GOTRUE_RATE_LIMIT_VERIFY: "100"
      GOTRUE_RATE_LIMIT_OTP: "100"
      # Вход через Google (необязательно: пусто — выключен).
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/auth/v1/callback

  rest:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      # Ровно схемы из supabase/config.toml: приватные схемы наружу не отдаются.
      PGRST_DB_SCHEMAS: public,projectceo_api,projectceo_read_api,projectceo_product_api,projectceo_m3_api,projectceo_m4_api,remhaos_channel_api,remhaos_integration_api,projectceo_platform_api
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_USE_LEGACY_GUCS: "false"

  storage:
    image: supabase/storage-api:v1.62.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: remhaos
      REGION: local
      GLOBAL_S3_BUCKET: remhaos
      ENABLE_IMAGE_TRANSFORMATION: "false"
      DB_INSTALL_ROLES: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage

  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [auth, rest, storage]
    environment:
      API_SITE_ADDRESS: ${API_SITE_ADDRESS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../supabase/email-templates:/srv/email-templates:ro
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: supabase_admin
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./volumes/storage:/storage:ro
      - ./backups:/backups
